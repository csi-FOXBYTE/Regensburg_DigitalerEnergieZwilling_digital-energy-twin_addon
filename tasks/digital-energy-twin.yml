---
- name: "Digital Energy Twin: Load config"
  set_fact:
    digital_energy_twin: "{{ inv_addons['digital-energy-twin'] }}"

- name: "Digital Energy Twin: Validate required config"
  ansible.builtin.assert:
    that:
      - digital_energy_twin.enable is defined
      - digital_energy_twin.ns_create is defined
      - digital_energy_twin.ns_name is defined
      - digital_energy_twin.ns_kubeconfig is defined
      - digital_energy_twin.oidc_client_id is defined
      - digital_energy_twin.admin_host is defined
      - digital_energy_twin.public_host is defined
      - digital_energy_twin.backend_host is defined
      - digital_energy_twin.backend_cors_additional_origins is defined
      - digital_energy_twin.tiles_url is defined
      - digital_energy_twin.terrain_url is defined
      - digital_energy_twin.address_database_url is defined
    fail_msg: >-
      Missing required keys in inv_addons['digital-energy-twin'].
      Expected: enable, ns_create, ns_name, ns_kubeconfig, oidc_client_id,
      admin_host, public_host, backend_host, backend_cors_additional_origins,
      tiles_url, terrain_url, address_database_url.

- name: "Digital Energy Twin: Select routing mode"
  ansible.builtin.set_fact:
    digital_energy_twin_routing_mode: "{{ digital_energy_twin.routing_mode | default('gateway') }}"

- name: "Digital Energy Twin: Validate routing mode"
  ansible.builtin.assert:
    that:
      - digital_energy_twin_routing_mode in ['gateway', 'ingress']
    fail_msg: >-
      digital-energy-twin.routing_mode must be gateway or ingress.
      Both modes route through APISIX; select the entry routing supported by the platform.

- name: "Digital Energy Twin: Validate Gateway API config"
  ansible.builtin.assert:
    that:
      - inv_k8s.gateway_class is defined
      - inv_k8s.gateway_class | length > 0
    fail_msg: >-
      Gateway routing mode requires Gateway API support, following Civitas Core.
      Set inv_k8s.gateway_class to the platform's GatewayClass name.
  when: digital_energy_twin_routing_mode == 'gateway'

- name: "Digital Energy Twin: Validate Ingress config"
  ansible.builtin.assert:
    that:
      - inv_k8s.ingress_class is defined
      - inv_k8s.ingress_class | length > 0
    fail_msg: >-
      Ingress routing mode requires inv_k8s.ingress_class to identify the
      platform's existing IngressClass.
  when: digital_energy_twin_routing_mode == 'ingress'

- name: "Digital Energy Twin: Validate database config type"
  ansible.builtin.assert:
    that:
      - digital_energy_twin.db is mapping
    fail_msg: "inv_addons['digital-energy-twin'].db must be a mapping."
  when: digital_energy_twin.db is defined

- name: "Digital Energy Twin: Select database mode"
  ansible.builtin.set_fact:
    digital_energy_twin_db_mode: "{{ digital_energy_twin.db.mode | default('existing') if digital_energy_twin.db is defined else 'central' }}"

- name: "Digital Energy Twin: Validate database mode"
  ansible.builtin.assert:
    that:
      - digital_energy_twin_db_mode in ['existing', 'zalando']
    fail_msg: >-
      db.mode must be existing or zalando. Omit db entirely to use central-db.
  when: digital_energy_twin.db is defined

- name: "Digital Energy Twin: Validate explicit database config"
  ansible.builtin.assert:
    that:
      - digital_energy_twin.db.ns_name is defined
      - digital_energy_twin.db.ns_name | length > 0
      - digital_energy_twin.db.db_address is defined
      - digital_energy_twin.db.db_address | length > 0
      - digital_energy_twin.db.db_name is defined
      - digital_energy_twin.db.db_name | length > 0
    fail_msg: >-
      Expected db.ns_name, db.db_address, and db.db_name.
      db.port is optional and defaults to 5432.
  when: digital_energy_twin.db is defined

- name: "Digital Energy Twin: Validate existing database config"
  ansible.builtin.assert:
    that:
      - digital_energy_twin.db.user_k8s_secret is defined
      - digital_energy_twin.db.user_k8s_secret | length > 0
    fail_msg: >-
      Existing database mode requires db.user_k8s_secret.
      The database, user, and credentials Secret must already exist.
  when: digital_energy_twin_db_mode == 'existing'

- name: "Digital Energy Twin: Validate Zalando database config"
  ansible.builtin.assert:
    that:
      - digital_energy_twin.db.cluster_name is defined
      - digital_energy_twin.db.cluster_name | length > 0
      - digital_energy_twin.db.db_name is match('^[a-z][a-z0-9_]*$')
      - digital_energy_twin.db.db_name | length <= 51
      - digital_energy_twin.db.user_k8s_secret is not defined or digital_energy_twin.db.user_k8s_secret | length > 0
    fail_msg: >-
      Zalando mode requires db.cluster_name identifying an existing postgresql
      resource in db.ns_name. Use a database name starting with a lowercase letter,
      containing only lowercase letters, underscores, and digits, with at most
      51 characters (to leave room for generated role names).
      Optional db.user_k8s_secret must be non-empty if supplied.
  when: digital_energy_twin_db_mode == 'zalando'

- name: "Digital Energy Twin: Validate central database config"
  ansible.builtin.assert:
    that:
      - inv_central_db is defined
      - inv_central_db.enable is defined
      - inv_central_db.enable | bool
      - inv_central_db.ns_name is defined
      - inv_central_db.ns_name | length > 0
    fail_msg: >-
      The default database mode requires the platform central-db to be enabled.
      Define inv_addons['digital-energy-twin'].db to use another database server.
  when: digital_energy_twin_db_mode == 'central'

# A matomo block indented one level too little lands outside the add-on and
# can drag the next block (e.g. rustfs) out of inv_addons with it.
- name: "Digital Energy Twin: Validate where the Matomo settings are"
  ansible.builtin.assert:
    that:
      - matomo is not defined
      - inv_addons.matomo is not defined
    fail_msg: >-
      Found a 'matomo' block outside inv_addons['digital-energy-twin']: it is indented too little.
      Move it under digital-energy-twin, at the same indentation as public_host, and check that the
      blocks after it (e.g. rustfs) are still indented under inv_addons.

- name: "Digital Energy Twin: Validate the Matomo setting names"
  ansible.builtin.assert:
    that:
      - digital_energy_twin_matomo_unknown_settings | length == 0
      - (digital_energy_twin.matomo | default({})).enable | default(false) is boolean
      - (digital_energy_twin.matomo | default({})).tracking_enabled | default(false) is boolean
    fail_msg: >-
      {{ ('Unknown Matomo settings: ' ~ (digital_energy_twin_matomo_unknown_settings | join(', ')) ~ '. ')
      if digital_energy_twin_matomo_unknown_settings | length > 0 else '' }}Known settings:
      {{ digital_energy_twin_matomo_known_settings | join(', ') }}; under backup:
      {{ digital_energy_twin_matomo_known_backup_settings | join(', ') }}. enable and tracking_enabled
      must be true or false, without quotes.
  vars:
    digital_energy_twin_matomo_known_settings:
      [enable, host, oidc_client_id, keycloak_internal_url, installed, install_allowed_cidrs, install_trusted_proxies,
       tracking_enabled, site_id, storage_class, data_size, db_size, db_image, backup]
    digital_energy_twin_matomo_known_backup_settings: [enable, target, schedule, keep_days, size]
    digital_energy_twin_matomo_unknown_settings: >-
      {{ ((digital_energy_twin.matomo | default({})).keys() | difference(digital_energy_twin_matomo_known_settings) | list)
      + ((((digital_energy_twin.matomo | default({})).backup | default({})).keys()
      | difference(digital_energy_twin_matomo_known_backup_settings)) | map('regex_replace', '^', 'backup.') | list) }}

- name: "Digital Energy Twin: Validate Matomo config"
  ansible.builtin.assert:
    that:
      - digital_energy_twin.matomo is mapping
      - digital_energy_twin.matomo.host is not defined or digital_energy_twin.matomo.host | length > 0
      - digital_energy_twin.matomo.backup | default({}) is mapping
      - digital_energy_twin.matomo.backup.target | default('pvc') in ['pvc']
      - digital_energy_twin.matomo.backup.keep_days | default(14) | int > 0
      - >-
        not (digital_energy_twin.matomo.tracking_enabled | default(false) | bool)
        or (digital_energy_twin.matomo.site_id | default('') | string) is match('^[1-9][0-9]*$')
    fail_msg: >-
      inv_addons['digital-energy-twin'].matomo must be a mapping.
      backup.target must be pvc (the only target so far) and backup.keep_days a
      positive number of days. tracking_enabled needs the numeric site_id of the
      DEZ website in Matomo.
  when: digital_energy_twin.matomo is defined

- name: "Digital Energy Twin: Validate selected application release"
  ansible.builtin.assert:
    that:
      - digital_energy_twin_application_release.repository == 'csi-FOXBYTE/Regensburg_DigitalerEnergieZwilling_MonoRepo'
      - digital_energy_twin_application_release.manifest.schema == 2
      - digital_energy_twin_application_release.tag == 'v' ~ digital_energy_twin_application_release.manifest.appVersion
      - digital_energy_twin_application_release.manifest.adminfrontend.digest is match('^sha256:[a-f0-9]{64}$')
      - digital_energy_twin_application_release.manifest.frontend.digest is match('^sha256:[a-f0-9]{64}$')
      - digital_energy_twin_application_release.manifest.backend.digest is match('^sha256:[a-f0-9]{64}$')
      # Releases up to v1.7.3 have no matomo image.
      - digital_energy_twin_application_release.manifest.matomo is not defined or digital_energy_twin_application_release.manifest.matomo.digest is match('^sha256:[a-f0-9]{64}$')
    fail_msg: "The selected monorepo release is incomplete; prepare it from a completed release manifest."
  when: digital_energy_twin_application_release is defined

- name: "Digital Energy Twin: Set defaults"
  set_fact:
    digital_energy_twin_enabled: "{{ digital_energy_twin.enable | bool }}"
    digital_energy_twin_ns_create: "{{ digital_energy_twin.ns_create | bool }}"
    digital_energy_twin_namespace: "{{ digital_energy_twin.ns_name }}"
    digital_energy_twin_oidc_callback_path: "/oidc/callback"
    digital_energy_twin_oidc_client_id: "{{ digital_energy_twin.oidc_client_id }}"
    digital_energy_twin_admin_direct_host: "{{ digital_energy_twin.admin_host }}"
    digital_energy_twin_public_direct_host: "{{ digital_energy_twin.public_host }}"
    digital_energy_twin_backend_direct_host: "{{ digital_energy_twin.backend_host }}"
    digital_energy_twin_application_version: "{{ digital_energy_twin_application_release.manifest.appVersion if digital_energy_twin_application_release is defined else '' }}"
    digital_energy_twin_admin_image: "{{ digital_energy_twin_application_release.manifest.adminfrontend.image ~ '@' ~ digital_energy_twin_application_release.manifest.adminfrontend.digest if digital_energy_twin_application_release is defined else software['digital-energy-twin'].admin.registry ~ '/' ~ software['digital-energy-twin'].admin.repository ~ ':' ~ software['digital-energy-twin'].admin.tag }}"
    digital_energy_twin_public_image: "{{ digital_energy_twin_application_release.manifest.frontend.image ~ '@' ~ digital_energy_twin_application_release.manifest.frontend.digest if digital_energy_twin_application_release is defined else software['digital-energy-twin'].public.registry ~ '/' ~ software['digital-energy-twin'].public.repository ~ ':' ~ software['digital-energy-twin'].public.tag }}"
    digital_energy_twin_backend_image: "{{ digital_energy_twin_application_release.manifest.backend.image ~ '@' ~ digital_energy_twin_application_release.manifest.backend.digest if digital_energy_twin_application_release is defined else software['digital-energy-twin'].backend.registry ~ '/' ~ software['digital-energy-twin'].backend.repository ~ ':' ~ software['digital-energy-twin'].backend.tag }}"
    digital_energy_twin_matomo_image: "{{ digital_energy_twin_application_release.manifest.matomo.image ~ '@' ~ digital_energy_twin_application_release.manifest.matomo.digest if digital_energy_twin_application_release is defined and digital_energy_twin_application_release.manifest.matomo is defined else '' }}"
    digital_energy_twin_database_secret_name: "digital-energy-twin-database"
    digital_energy_twin_smtp_secret_name: "digital-energy-twin-smtp"
    digital_energy_twin_feedback_mail_to: "{{ digital_energy_twin.feedback_mail_to | default('') | trim }}"
    digital_energy_twin_backend_port: "{{ digital_energy_twin.backend_port | default(5000) | int }}"
    digital_energy_twin_admin_port: "{{ digital_energy_twin.admin_port | default(8080) | int }}"
    digital_energy_twin_public_port: "{{ digital_energy_twin.public_port | default(8080) | int }}"
    digital_energy_twin_admin_required_role: "admin"
    digital_energy_twin_manager_required_role: "manager"
    digital_energy_twin_maintainer_required_role: "maintainer"
    digital_energy_twin_apisix_namespace: "{{ inv_access.apisix.ns_name | lower }}"
    digital_energy_twin_apisix_service_name: "{{ inv_access.apisix.helm_release_name }}-gateway"
    digital_energy_twin_tiles_url: "{{ digital_energy_twin.tiles_url }}"
    digital_energy_twin_terrain_url: "{{ digital_energy_twin.terrain_url }}"
    digital_energy_twin_address_database_url: "{{ digital_energy_twin.address_database_url }}"
    digital_energy_twin_backend_common_plugins:
      cors:
        allow_origins: "{{ ((['https://' ~ digital_energy_twin.public_host, 'https://' ~ digital_energy_twin.admin_host] + digital_energy_twin.backend_cors_additional_origins) | unique) | join(',') }}"
        allow_methods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
        allow_headers: "Accept,Authorization,Content-Type,Origin,Referer,User-Agent,X-Access-Token,X-Requested-With"
        expose_headers: "Content-Length,Content-Type,Date,Server"
        max_age: 3600
        allow_credential: true
      limit-count:
        count: 200
        time_window: 60
        rejected_code: 429
        key_type: var
        key: remote_addr
        policy: local
      response-rewrite:
        headers:
          set:
            X-Content-Type-Options: "nosniff"
            X-Frame-Options: "DENY"
            Referrer-Policy: "strict-origin-when-cross-origin"
            Permissions-Policy: "geolocation=(), microphone=(), camera=()"
            X-XSS-Protection: "1; mode=block"
            Strict-Transport-Security: "max-age=31536000; includeSubDomains"
            Content-Security-Policy: "default-src 'self'; frame-ancestors 'none'; base-uri 'self'"

- name: "Digital Energy Twin: Load Matomo config"
  ansible.builtin.set_fact:
    digital_energy_twin_matomo_config: "{{ digital_energy_twin.matomo | default({}) }}"

- name: "Digital Energy Twin: Set Matomo defaults"
  ansible.builtin.set_fact:
    digital_energy_twin_matomo_requested: "{{ digital_energy_twin_enabled and (digital_energy_twin_matomo_config.enable | default(false) | bool) }}"
    # Releases up to v1.7.3 have no matomo image; Matomo is then skipped.
    digital_energy_twin_matomo_enabled: >-
      {{ digital_energy_twin_enabled and (digital_energy_twin_matomo_config.enable | default(false) | bool)
      and digital_energy_twin_matomo_image | length > 0 }}
    digital_energy_twin_matomo_host: "{{ digital_energy_twin_matomo_config.host | default('matomo.det.' ~ DOMAIN) }}"
    # Detected after the deployment ("Check whether Matomo is installed").
    digital_energy_twin_matomo_installed: false
    digital_energy_twin_matomo_install_secret_name: "digital-energy-twin-matomo-install"
    digital_energy_twin_matomo_name: "digital-energy-twin-matomo"
    digital_energy_twin_matomo_data_pvc_name: "digital-energy-twin-matomo-data"
    digital_energy_twin_matomo_data_size: "{{ digital_energy_twin_matomo_config.data_size | default('5Gi') }}"
    digital_energy_twin_matomo_storage_class: "{{ digital_energy_twin_matomo_config.storage_class | default('') }}"
    digital_energy_twin_matomo_db_name: "digital-energy-twin-matomo-db"
    digital_energy_twin_matomo_db_image: >-
      {{ digital_energy_twin_matomo_config.db_image
      | default('docker.io/library/mariadb:11.8.9@sha256:6422478cb8e159f080fb1d8ccf65101e26fe51385787fde7d16c3b165a331f15') }}
    digital_energy_twin_matomo_db_size: "{{ digital_energy_twin_matomo_config.db_size | default('10Gi') }}"
    digital_energy_twin_matomo_db_secret_name: "digital-energy-twin-matomo-db"
    digital_energy_twin_matomo_db_database: "matomo"
    digital_energy_twin_matomo_db_user: "matomo"
    digital_energy_twin_matomo_backup_name: "digital-energy-twin-matomo-backup"
    digital_energy_twin_matomo_oidc_client_id: "{{ digital_energy_twin_matomo_config.oidc_client_id | default('matomo') }}"
    digital_energy_twin_matomo_oidc_secret_name: "digital-energy-twin-matomo-oidc"
    # Optional internal Keycloak URL for Matomo's token and userinfo calls.
    digital_energy_twin_matomo_keycloak_internal_url: "{{ digital_energy_twin_matomo_config.keycloak_internal_url | default('') }}"
    digital_energy_twin_matomo_viewer_role: "matomoViewer"
    digital_energy_twin_matomo_admin_role: "matomoAdmin"
    digital_energy_twin_matomo_flow_alias: "matomo browser"
    # Switch on only once section 12 of the privacy notice is complete for this customer.
    digital_energy_twin_matomo_tracking: >-
      {{ digital_energy_twin_enabled and (digital_energy_twin_matomo_config.enable | default(false) | bool)
      and digital_energy_twin_matomo_image | length > 0
      and (digital_energy_twin_matomo_config.tracking_enabled | default(false) | bool) }}
    digital_energy_twin_matomo_site_id: "{{ digital_energy_twin_matomo_config.site_id | default('') | string }}"
    # Civitas Core backs up only PostgreSQL; the addon backs up Matomo itself.
    digital_energy_twin_matomo_backup_enabled: "{{ (digital_energy_twin_matomo_config.backup | default({})).enable | default(true) | bool }}"
    digital_energy_twin_matomo_backup_target: "{{ (digital_energy_twin_matomo_config.backup | default({})).target | default('pvc') }}"
    digital_energy_twin_matomo_backup_schedule: "{{ (digital_energy_twin_matomo_config.backup | default({})).schedule | default('30 2 * * *') }}"
    digital_energy_twin_matomo_backup_keep_days: "{{ (digital_energy_twin_matomo_config.backup | default({})).keep_days | default(14) | int }}"
    digital_energy_twin_matomo_backup_size: "{{ (digital_energy_twin_matomo_config.backup | default({})).size | default('10Gi') }}"

- name: "Digital Energy Twin: Report skipped Matomo"
  ansible.builtin.debug:
    msg: >-
      Matomo is enabled, but the selected application release
      {{ digital_energy_twin_application_release.tag | default('(tag-based selection)') }}
      contains no matomo image. Matomo is skipped until a release with Matomo is adopted.
  when: digital_energy_twin_matomo_requested and not digital_energy_twin_matomo_enabled

- name: "Digital Energy Twin: Validate feedback mail transport"
  ansible.builtin.assert:
    that:
      - inv_email is defined
      - inv_email.server is defined and inv_email.server | length > 0
      - inv_email.port is defined and inv_email.port | int > 0 and inv_email.port | int < 65536
      - inv_email.starttls is defined
      - inv_email.user is defined
      - inv_email.password is defined
      - inv_email.email_from is defined and inv_email.email_from | length > 0
    fail_msg: >-
      feedback_mail_to requires inv_email.server, port, starttls, user,
      password, and email_from. STARTTLS and implicit TLS are the only
      supported transport modes.
  when: digital_energy_twin_enabled and digital_energy_twin_feedback_mail_to | length > 0

- name: "Digital Energy Twin: Build TLS-only SMTP URL"
  ansible.builtin.set_fact:
    digital_energy_twin_smtp_url: >-
      {{ "smtp" if inv_email.starttls | bool else "smtps" }}://{{ ((inv_email.user | urlencode | replace("/", "%2F")) ~ ":" ~ (inv_email.password | urlencode | replace("/", "%2F")) ~ "@") if inv_email.password | length > 0 else "" }}{{ inv_email.server }}:{{ inv_email.port }}
  when: digital_energy_twin_enabled and digital_energy_twin_feedback_mail_to | length > 0
  no_log: true

- name: "Digital Energy Twin: Set service names"
  set_fact:
    digital_energy_twin_admin_service_name: "{{ digital_energy_twin_admin_direct_host | replace('.', '-') }}"
    digital_energy_twin_public_service_name: "{{ digital_energy_twin_public_direct_host | replace('.', '-') }}"
    digital_energy_twin_backend_service_name: "{{ digital_energy_twin_backend_direct_host | replace('.', '-') }}"
    digital_energy_twin_matomo_service_name: "{{ digital_energy_twin_matomo_host | replace('.', '-') }}"

- name: "Digital Energy Twin: Set routing hosts"
  ansible.builtin.set_fact:
    digital_energy_twin_routing_hosts:
      - name: digital-energy-twin-admin-host
        hostname: "{{ digital_energy_twin_admin_direct_host }}"
      - name: digital-energy-twin-public-host
        hostname: "{{ digital_energy_twin_public_direct_host }}"
      - name: digital-energy-twin-backend-host
        hostname: "{{ digital_energy_twin_backend_direct_host }}"

- name: "Digital Energy Twin: Add Matomo routing host"
  ansible.builtin.set_fact:
    digital_energy_twin_routing_hosts: >-
      {{ digital_energy_twin_routing_hosts
      + [{'name': 'digital-energy-twin-matomo-host', 'hostname': digital_energy_twin_matomo_host}] }}
  when: digital_energy_twin_matomo_enabled

- name: "Digital Energy Twin: Resolve upstreams"
  set_fact:
    digital_energy_twin_admin_upstream_host: "{{ digital_energy_twin_admin_service_name }}.{{ digital_energy_twin_namespace }}.svc.cluster.local"
    digital_energy_twin_admin_upstream_port: "80"
    digital_energy_twin_public_upstream_host: "{{ digital_energy_twin_public_service_name }}.{{ digital_energy_twin_namespace }}.svc.cluster.local"
    digital_energy_twin_public_upstream_port: "80"
    digital_energy_twin_backend_upstream_host: "{{ digital_energy_twin_backend_service_name }}.{{ digital_energy_twin_namespace }}.svc.cluster.local"
    digital_energy_twin_matomo_upstream_host: "{{ digital_energy_twin_matomo_service_name }}.{{ digital_energy_twin_namespace }}.svc.cluster.local"
  when: digital_energy_twin_enabled

- name: "Digital Energy Twin: Set default facts for K8S"
  ansible.builtin.set_fact:
    k8s_config: "{{ K8S_KUBECONFIG_PATH }}/{{ digital_energy_twin.ns_kubeconfig }}"
    k8s_context: "{{ inv_k8s.config.context }}"
    k8s_namespace: "{{ digital_energy_twin_namespace }}"
  when: digital_energy_twin_enabled

- name: "Digital Energy Twin: Discover Gateway API resources"
  kubernetes.core.k8s_info:
    api_version: gateway.networking.k8s.io/v1
    kind: "{{ digital_energy_twin_gateway_kind }}"
    name: digital-energy-twin-admin-host
    namespace: "{{ digital_energy_twin_apisix_namespace }}"
    kubeconfig: "{{ K8S_KUBECONFIG_PATH }}/{{ inv_access.apisix.ns_kubeconfig }}"
    context: "{{ k8s_context }}"
  loop:
    - Gateway
    - HTTPRoute
  loop_control:
    loop_var: digital_energy_twin_gateway_kind
  register: digital_energy_twin_gateway_api
  when: digital_energy_twin_enabled and digital_energy_twin_routing_mode == 'gateway'

- name: "Digital Energy Twin: Validate Gateway API availability"
  ansible.builtin.assert:
    that:
      - digital_energy_twin_gateway_api_result.api_found | default(false)
    fail_msg: >-
      Gateway API v1 {{ digital_energy_twin_gateway_api_result.digital_energy_twin_gateway_kind }}
      is unavailable in context '{{ k8s_context }}'. The platform must install
      Gateway API and run a controller for '{{ inv_k8s.gateway_class }}'.
      Gateway routing mode does not use Kubernetes Ingress resources.
  loop: "{{ digital_energy_twin_gateway_api.results | default([]) }}"
  loop_control:
    loop_var: digital_energy_twin_gateway_api_result
    label: "{{ digital_energy_twin_gateway_api_result.digital_energy_twin_gateway_kind }}"
  when: digital_energy_twin_enabled and digital_energy_twin_routing_mode == 'gateway'

- name: "Digital Energy Twin: Ensure namespace exists (if ns_create=true)"
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ k8s_namespace }}"
  when: digital_energy_twin_enabled and digital_energy_twin_ns_create

- name: "Digital Energy Twin: Check namespace exists (if ns_create=false)"
  kubernetes.core.k8s_info:
    kind: Namespace
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    name: "{{ k8s_namespace }}"
  register: digital_energy_twin_namespace_info
  when: digital_energy_twin_enabled and not digital_energy_twin_ns_create

- name: "Digital Energy Twin: Fail if namespace is missing and ns_create=false"
  ansible.builtin.assert:
    that:
      - digital_energy_twin_namespace_info.resources | length > 0
    fail_msg: >-
      Namespace '{{ k8s_namespace }}' does not exist but ns_create is false.
      Create the namespace manually or set inv_addons['digital-energy-twin'].ns_create to true.
  when: digital_energy_twin_enabled and not digital_energy_twin_ns_create

- name: "Digital Energy Twin: Select central database"
  ansible.builtin.set_fact:
    digital_energy_twin_db_cluster_name: central-db
    digital_energy_twin_db_host: "central-db.{{ inv_central_db.ns_name }}.svc.cluster.local"
    digital_energy_twin_db_port: "{{ inv_central_db.port | default('5432') }}"
    digital_energy_twin_db_name: "digital_energy_twin"
    digital_energy_twin_db_secret_namespace: "{{ inv_central_db.ns_name }}"
    digital_energy_twin_db_secret_name: "digital-energy-twin-owner-user.central-db.credentials.postgresql.acid.zalan.do"
  when: digital_energy_twin_enabled and digital_energy_twin_db_mode == 'central'

- name: "Digital Energy Twin: Select explicit database connection"
  ansible.builtin.set_fact:
    digital_energy_twin_db_host: "{{ digital_energy_twin.db.db_address }}"
    digital_energy_twin_db_port: "{{ digital_energy_twin.db.port | default('5432') }}"
    digital_energy_twin_db_name: "{{ digital_energy_twin.db.db_name }}"
    digital_energy_twin_db_secret_namespace: "{{ digital_energy_twin.db.ns_name }}"
  when: digital_energy_twin_enabled and digital_energy_twin_db_mode in ['existing', 'zalando']

- name: "Digital Energy Twin: Select existing database credentials"
  ansible.builtin.set_fact:
    digital_energy_twin_db_secret_name: "{{ digital_energy_twin.db.user_k8s_secret }}"
  when: digital_energy_twin_enabled and digital_energy_twin_db_mode == 'existing'

- name: "Digital Energy Twin: Select Zalando cluster and owner credentials"
  ansible.builtin.set_fact:
    digital_energy_twin_db_cluster_name: "{{ digital_energy_twin.db.cluster_name }}"
    digital_energy_twin_db_secret_name: "{{ digital_energy_twin.db.user_k8s_secret | default((digital_energy_twin_db_name | replace('_', '-')) ~ '-owner-user.' ~ digital_energy_twin.db.cluster_name ~ '.credentials.postgresql.acid.zalan.do') }}"
  when: digital_energy_twin_enabled and digital_energy_twin_db_mode == 'zalando'

- name: "Digital Energy Twin: Get target Zalando cluster"
  kubernetes.core.k8s_info:
    api_version: acid.zalan.do/v1
    kind: postgresql
    namespace: "{{ digital_energy_twin_db_secret_namespace }}"
    name: "{{ digital_energy_twin_db_cluster_name }}"
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
  register: digital_energy_twin_db_cluster
  when: digital_energy_twin_enabled and digital_energy_twin_db_mode in ['central', 'zalando']

- name: "Digital Energy Twin: Validate target Zalando cluster exists"
  ansible.builtin.assert:
    that:
      - digital_energy_twin_db_cluster.resources | length == 1
    fail_msg: >-
      Zalando PostgreSQL cluster '{{ digital_energy_twin_db_cluster_name }}' must
      already exist in namespace '{{ digital_energy_twin_db_secret_namespace }}'.
      The addon provisions a database within this cluster, not a PostgreSQL server.
  when: digital_energy_twin_enabled and digital_energy_twin_db_mode in ['central', 'zalando']

- name: "Digital Energy Twin: Ensure database and owner user exist on target Zalando cluster"
  kubernetes.core.k8s:
    state: patched
    merge_type: merge
    namespace: "{{ digital_energy_twin_db_secret_namespace }}"
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    definition:
      apiVersion: acid.zalan.do/v1
      kind: postgresql
      metadata:
        name: "{{ digital_energy_twin_db_cluster_name }}"
        namespace: "{{ digital_energy_twin_db_secret_namespace }}"
      spec:
        preparedDatabases: "{{ {digital_energy_twin_db_name: {'defaultUsers': true, 'schemas': {'public': {'defaultRoles': false}}}} }}"
  when: digital_energy_twin_enabled and digital_energy_twin_db_mode in ['central', 'zalando']

- name: "Digital Energy Twin: Get database application credentials secret"
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: "{{ digital_energy_twin_db_secret_namespace }}"
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    name: "{{ digital_energy_twin_db_secret_name }}"
  register: digital_energy_twin_db_secret
  until: digital_energy_twin_db_secret.resources | length > 0
  retries: 30
  delay: 10
  when: digital_energy_twin_enabled
  no_log: true

- name: "Digital Energy Twin: Validate database application credentials secret"
  ansible.builtin.assert:
    that:
      - digital_energy_twin_db_secret.resources[0].data.username is defined
      - digital_energy_twin_db_secret.resources[0].data.password is defined
    fail_msg: >-
      Database credentials Secret '{{ digital_energy_twin_db_secret_name }}' must
      contain the keys 'username' and 'password'.
  when: digital_energy_twin_enabled

- name: "Digital Energy Twin: Build database URL from application credentials"
  ansible.builtin.set_fact:
    digital_energy_twin_database_url: >-
      postgresql://{{ digital_energy_twin_db_secret.resources[0].data.username | b64decode | urlencode | replace('/', '%2F') }}:{{ digital_energy_twin_db_secret.resources[0].data.password | b64decode | urlencode | replace('/', '%2F') }}@{{ digital_energy_twin_db_host }}:{{ digital_energy_twin_db_port }}/{{ digital_energy_twin_db_name | urlencode | replace('/', '%2F') }}
  when: digital_energy_twin_enabled
  no_log: true

- name: "Digital Energy Twin: Store database URL in addon namespace"
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    namespace: "{{ k8s_namespace }}"
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ digital_energy_twin_database_secret_name }}"
      type: Opaque
      stringData:
        DATABASE_URL: "{{ digital_energy_twin_database_url }}"
  when: digital_energy_twin_enabled
  no_log: true

- name: "Digital Energy Twin: Store SMTP URL in addon namespace"
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    namespace: "{{ k8s_namespace }}"
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ digital_energy_twin_smtp_secret_name }}"
      type: Opaque
      stringData:
        SMTP_URL: "{{ digital_energy_twin_smtp_url }}"
  when: digital_energy_twin_enabled and digital_energy_twin_feedback_mail_to | length > 0
  no_log: true

- name: "Digital Energy Twin: Ensure placeholder content configmap"
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    namespace: "{{ k8s_namespace }}"
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: digital-energy-twin-placeholder
      data:
        admin-index.html: |
          <!doctype html>
          <html>
            <head><meta charset="utf-8"><title>Digital Energy Twin Admin</title></head>
            <body><h1>hello world</h1><p>admin client</p></body>
          </html>
        public-index.html: |
          <!doctype html>
          <html>
            <head><meta charset="utf-8"><title>Digital Energy Twin Public</title></head>
            <body><h1>hello world</h1><p>public client</p></body>
          </html>
  when: digital_energy_twin_enabled

- name: "Digital Energy Twin: Ensure admin deployment"
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    namespace: "{{ k8s_namespace }}"
    definition: "{{ lookup('template', addon_dir + 'templates/digital_energy_twin_admin_deploy.yaml.j2') | from_yaml }}"
  when: digital_energy_twin_enabled

- name: "Digital Energy Twin: Ensure admin service"
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    namespace: "{{ k8s_namespace }}"
    definition: "{{ lookup('template', addon_dir + 'templates/digital_energy_twin_admin_svc.yaml.j2') | from_yaml }}"
  when: digital_energy_twin_enabled

- name: "Digital Energy Twin: Ensure public deployment"
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    namespace: "{{ k8s_namespace }}"
    definition: "{{ lookup('template', addon_dir + 'templates/digital_energy_twin_public_deploy.yaml.j2') | from_yaml }}"
  when: digital_energy_twin_enabled

- name: "Digital Energy Twin: Ensure public service"
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    namespace: "{{ k8s_namespace }}"
    definition: "{{ lookup('template', addon_dir + 'templates/digital_energy_twin_public_svc.yaml.j2') | from_yaml }}"
  when: digital_energy_twin_enabled

- name: "Digital Energy Twin: Ensure backend deployment"
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    namespace: "{{ k8s_namespace }}"
    definition: "{{ lookup('template', addon_dir + 'templates/digital_energy_twin_backend_deploy.yaml.j2') | from_yaml }}"
  when: digital_energy_twin_enabled

- name: "Digital Energy Twin: Ensure backend service"
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    namespace: "{{ k8s_namespace }}"
    definition: "{{ lookup('template', addon_dir + 'templates/digital_energy_twin_backend_svc.yaml.j2') | from_yaml }}"
  when: digital_energy_twin_enabled

- name: "Digital Energy Twin: Ensure Ingress routing for addon hosts"
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ K8S_KUBECONFIG_PATH }}/{{ inv_access.apisix.ns_kubeconfig }}"
    context: "{{ k8s_context }}"
    namespace: "{{ digital_energy_twin_apisix_namespace }}"
    definition: "{{ lookup('template', addon_dir + 'templates/digital_energy_twin_ingress.yaml.j2') | from_yaml }}"
  loop: "{{ digital_energy_twin_routing_hosts }}"
  loop_control:
    loop_var: digital_energy_twin_ingress_host
    label: "{{ digital_energy_twin_ingress_host.hostname }}"
  when: digital_energy_twin_enabled and digital_energy_twin_routing_mode == 'ingress'

- name: "Digital Energy Twin: Ensure Gateway API routing for addon hosts"
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ K8S_KUBECONFIG_PATH }}/{{ inv_access.apisix.ns_kubeconfig }}"
    context: "{{ k8s_context }}"
    namespace: "{{ digital_energy_twin_apisix_namespace }}"
    definition: "{{ lookup('template', addon_dir + 'templates/digital_energy_twin_gateway.yaml.j2') | from_yaml_all | list }}"
  loop: "{{ digital_energy_twin_routing_hosts }}"
  loop_control:
    loop_var: digital_energy_twin_gateway_host
    label: "{{ digital_energy_twin_gateway_host.hostname }}"
  when: digital_energy_twin_enabled and digital_energy_twin_routing_mode == 'gateway'

- name: "Digital Energy Twin: Remove Gateway redirects when HTTP is enabled"
  kubernetes.core.k8s:
    state: absent
    api_version: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    name: "{{ digital_energy_twin_gateway_redirect_host.name }}-redirect"
    kubeconfig: "{{ K8S_KUBECONFIG_PATH }}/{{ inv_access.apisix.ns_kubeconfig }}"
    context: "{{ k8s_context }}"
    namespace: "{{ digital_energy_twin_apisix_namespace }}"
  loop: "{{ digital_energy_twin_routing_hosts }}"
  loop_control:
    loop_var: digital_energy_twin_gateway_redirect_host
    label: "{{ digital_energy_twin_gateway_redirect_host.hostname }}"
  when:
    - digital_energy_twin_enabled
    - digital_energy_twin_routing_mode == 'gateway'
    - inv_k8s.ingress.http | default(false) | bool

- name: "Digital Energy Twin: Get IDM settings and api-access secret"
  include_tasks:
    file: "../../../tasks/access/apis/idm_settings_for_apis.yaml"
  when: digital_energy_twin_enabled

- name: "Digital Energy Twin: Check if OIDC client exists"
  set_fact:
    digital_energy_twin_client_exists: "{{ (clients.json | json_query(query) | length) > 0 }}"
  vars:
    query: "[?clientId== '{{ digital_energy_twin_oidc_client_id }}']"
  when: digital_energy_twin_enabled

- name: "Digital Energy Twin: Create OIDC client"
  uri:
    method: POST
    url: "{{ inv_access.platform.hostname }}/admin/realms/{{ inv_access.tenant.realm_name }}/clients"
    return_content: yes
    ca_path: "{{ inv_k8s.ingress.ca_path }}"
    body_format: json
    body:
      clientId: "{{ digital_energy_twin_oidc_client_id }}"
      enabled: true
      clientAuthenticatorType: "client-secret"
      protocol: "openid-connect"
      publicClient: false
      standardFlowEnabled: true
      directAccessGrantsEnabled: true
      redirectUris:
        - "https://{{ digital_energy_twin_admin_direct_host }}/*"
        - "https://{{ digital_energy_twin_public_direct_host }}/*"
        - "https://{{ digital_energy_twin_admin_direct_host }}{{ digital_energy_twin_oidc_callback_path }}"
        - "https://{{ digital_energy_twin_public_direct_host }}{{ digital_energy_twin_oidc_callback_path }}"
      webOrigins:
        - "https://{{ digital_energy_twin_admin_direct_host }}"
        - "https://{{ digital_energy_twin_public_direct_host }}"
        - "https://{{ digital_energy_twin_backend_direct_host }}"
    headers:
      Accept: application/json
      Authorization: "Bearer {{ keycloak_login.json.access_token }}"
    status_code:
      - 201
      - 409
  when: digital_energy_twin_enabled and not digital_energy_twin_client_exists

- name: "Digital Energy Twin: Refresh client list"
  uri:
    method: GET
    url: "{{ inv_access.platform.hostname }}/admin/realms/{{ inv_access.tenant.realm_name }}/clients"
    return_content: yes
    ca_path: "{{ inv_k8s.ingress.ca_path }}"
    headers:
      Accept: application/json
      Authorization: "Bearer {{ keycloak_login.json.access_token }}"
    status_code: 200
  register: digital_energy_twin_clients
  when: digital_energy_twin_enabled

- name: "Digital Energy Twin: Resolve OIDC client internal id"
  set_fact:
    digital_energy_twin_client_internal_id: "{{ digital_energy_twin_clients.json | json_query(query) }}"
  vars:
    query: "[?clientId== '{{ digital_energy_twin_oidc_client_id }}'].id | [0]"
  when: digital_energy_twin_enabled

- name: "Digital Energy Twin: Get existing OIDC client details"
  uri:
    method: GET
    url: "{{ inv_access.platform.hostname }}/admin/realms/{{ inv_access.tenant.realm_name }}/clients/{{ digital_energy_twin_client_internal_id }}"
    return_content: yes
    ca_path: "{{ inv_k8s.ingress.ca_path }}"
    headers:
      Accept: application/json
      Authorization: "Bearer {{ keycloak_login.json.access_token }}"
    status_code: 200
  register: digital_energy_twin_client_details
  when: digital_energy_twin_enabled

- name: "Digital Energy Twin: Update OIDC client redirect/web origins"
  uri:
    method: PUT
    url: "{{ inv_access.platform.hostname }}/admin/realms/{{ inv_access.tenant.realm_name }}/clients/{{ digital_energy_twin_client_internal_id }}"
    return_content: yes
    ca_path: "{{ inv_k8s.ingress.ca_path }}"
    body_format: json
    body: "{{ digital_energy_twin_client_details.json | combine(client_updates, recursive=True) }}"
    headers:
      Accept: application/json
      Authorization: "Bearer {{ keycloak_login.json.access_token }}"
    status_code: 204
  vars:
    client_updates:
      redirectUris:
        - "https://{{ digital_energy_twin_admin_direct_host }}/*"
        - "https://{{ digital_energy_twin_public_direct_host }}/*"
        - "https://{{ digital_energy_twin_admin_direct_host }}{{ digital_energy_twin_oidc_callback_path }}"
        - "https://{{ digital_energy_twin_public_direct_host }}{{ digital_energy_twin_oidc_callback_path }}"
      webOrigins:
        - "https://{{ digital_energy_twin_admin_direct_host }}"
        - "https://{{ digital_energy_twin_public_direct_host }}"
        - "https://{{ digital_energy_twin_backend_direct_host }}"
  when: digital_energy_twin_enabled

- name: "Digital Energy Twin: Get OIDC client secret"
  uri:
    method: GET
    url: "{{ inv_access.platform.hostname }}/admin/realms/{{ inv_access.tenant.realm_name }}/clients/{{ digital_energy_twin_client_internal_id }}/client-secret"
    return_content: yes
    ca_path: "{{ inv_k8s.ingress.ca_path }}"
    headers:
      Accept: application/json
      Authorization: "Bearer {{ keycloak_login.json.access_token }}"
    status_code: 200
  register: digital_energy_twin_client_secret_response
  when: digital_energy_twin_enabled

- name: "Digital Energy Twin: Ensure OIDC client role admin"
  uri:
    method: POST
    url: "{{ inv_access.platform.hostname }}/admin/realms/{{ inv_access.tenant.realm_name }}/clients/{{ digital_energy_twin_client_internal_id }}/roles"
    return_content: yes
    ca_path: "{{ inv_k8s.ingress.ca_path }}"
    body_format: json
    body:
      name: "{{ digital_energy_twin_admin_required_role }}"
      composite: false
      clientRole: true
    headers:
      Accept: application/json
      Authorization: "Bearer {{ keycloak_login.json.access_token }}"
    status_code:
      - 201
      - 409
  when: digital_energy_twin_enabled

- name: "Digital Energy Twin: Ensure OIDC client role manager (Verwalter)"
  uri:
    method: POST
    url: "{{ inv_access.platform.hostname }}/admin/realms/{{ inv_access.tenant.realm_name }}/clients/{{ digital_energy_twin_client_internal_id }}/roles"
    return_content: yes
    ca_path: "{{ inv_k8s.ingress.ca_path }}"
    body_format: json
    body:
      name: "{{ digital_energy_twin_manager_required_role }}"
      description: "Verwalter"
      composite: false
      clientRole: true
    headers:
      Accept: application/json
      Authorization: "Bearer {{ keycloak_login.json.access_token }}"
    status_code:
      - 201
      - 409
  when: digital_energy_twin_enabled

- name: "Digital Energy Twin: Ensure OIDC client role maintainer (Systempfleger)"
  uri:
    method: POST
    url: "{{ inv_access.platform.hostname }}/admin/realms/{{ inv_access.tenant.realm_name }}/clients/{{ digital_energy_twin_client_internal_id }}/roles"
    return_content: yes
    ca_path: "{{ inv_k8s.ingress.ca_path }}"
    body_format: json
    body:
      name: "{{ digital_energy_twin_maintainer_required_role }}"
      description: "Systempfleger"
      composite: false
      clientRole: true
    headers:
      Accept: application/json
      Authorization: "Bearer {{ keycloak_login.json.access_token }}"
    status_code:
      - 201
      - 409
  when: digital_energy_twin_enabled

- name: "Digital Energy Twin: Upsert APISIX upstream (admin)"
  uri:
    method: PUT
    url: "https://api-admin.{{ DOMAIN }}/apisix/admin/upstreams/digital-energy-twin-admin-upstream"
    ca_path: "{{ inv_k8s.ingress.ca_path }}"
    body_format: json
    body:
      name: "digital-energy-twin-admin-upstream"
      desc: "Admin upstream for static panel"
      type: "roundrobin"
      scheme: "http"
      nodes: "{{ { (digital_energy_twin_admin_upstream_host ~ ':' ~ digital_energy_twin_admin_upstream_port) : 1 } }}"
    headers:
      Accept: application/json
      X-API-KEY: "{{ inv_access.apisix.api_credentials.admin_role }}"
    status_code:
      - 200
      - 201
  when: digital_energy_twin_enabled

- name: "Digital Energy Twin: Upsert APISIX upstream (public)"
  uri:
    method: PUT
    url: "https://api-admin.{{ DOMAIN }}/apisix/admin/upstreams/digital-energy-twin-public-upstream"
    ca_path: "{{ inv_k8s.ingress.ca_path }}"
    body_format: json
    body:
      name: "digital-energy-twin-public-upstream"
      desc: "Public upstream for static panel"
      type: "roundrobin"
      scheme: "http"
      nodes: "{{ { (digital_energy_twin_public_upstream_host ~ ':' ~ digital_energy_twin_public_upstream_port) : 1 } }}"
    headers:
      Accept: application/json
      X-API-KEY: "{{ inv_access.apisix.api_credentials.admin_role }}"
    status_code:
      - 200
      - 201
  when: digital_energy_twin_enabled

- name: "Digital Energy Twin: Upsert APISIX upstream (backend)"
  uri:
    method: PUT
    url: "https://api-admin.{{ DOMAIN }}/apisix/admin/upstreams/digital-energy-twin-backend-upstream"
    ca_path: "{{ inv_k8s.ingress.ca_path }}"
    body_format: json
    body:
      name: "digital-energy-twin-backend-upstream"
      desc: "Backend upstream for API"
      type: "roundrobin"
      scheme: "http"
      nodes: "{{ { (digital_energy_twin_backend_upstream_host ~ ':80') : 1 } }}"
    headers:
      Accept: application/json
      X-API-KEY: "{{ inv_access.apisix.api_credentials.admin_role }}"
    status_code:
      - 200
      - 201
  when: digital_energy_twin_enabled

- name: "Digital Energy Twin: Upsert protected admin direct-host route"
  uri:
    method: PUT
    url: "https://api-admin.{{ DOMAIN }}/apisix/admin/routes/digital-energy-twin-admin-direct"
    ca_path: "{{ inv_k8s.ingress.ca_path }}"
    body_format: json
    body:
      name: "digital-energy-twin-admin-direct"
      desc: "Protected admin direct-host route"
      hosts:
        - "{{ digital_energy_twin_admin_direct_host }}"
      uri: "/*"
      upstream_id: "digital-energy-twin-admin-upstream"
      status: 1
      plugins:
        openid-connect:
          bearer_only: false
          unauth_action: auth
          timeout: 2
          introspection_interval: 300
          client_id: "{{ digital_energy_twin_oidc_client_id }}"
          client_secret: "{{ digital_energy_twin_client_secret_response.json.value }}"
          redirect_uri: "https://{{ digital_energy_twin_admin_direct_host }}{{ digital_energy_twin_oidc_callback_path }}"
          logout_path: /logout
          post_logout_redirect_uri: "https://{{ digital_energy_twin_admin_direct_host }}/"
          discovery: "{{ inv_access.platform.hostname }}/realms/{{ inv_access.tenant.realm_name }}/.well-known/openid-configuration"
          introspection_endpoint: "{{ inv_access.platform.hostname }}/realms/{{ inv_access.tenant.realm_name }}/protocol/openid-connect/token/introspect"
          introspection_endpoint_auth_method: post
          realm: "{{ inv_access.tenant.realm_name }}"
          set_userinfo_header: true
          set_access_token_header: true
          session:
            secret: "{{ digital_energy_twin_oidc_session_secret | default(inv_access.apisix.api_credentials.admin_role) }}"
            cookie:
              name: "det_admin_session"
              path: "/"
              secure: true
              http_only: true
              samesite: "None"
        serverless-post-function:
          _meta:
            disable: false
          phase: before_proxy
          functions:
            - |-
              return function()
                  local core = require("apisix.core")
                  local required_client = "{{ digital_energy_twin_oidc_client_id }}"
                  local allowed_roles = {
                    ["{{ digital_energy_twin_admin_required_role }}"] = true,
                    ["{{ digital_energy_twin_manager_required_role }}"] = true,
                    ["{{ digital_energy_twin_maintainer_required_role }}"] = true
                  }
                  local headers = ngx.req.get_headers()

                  local token = headers["X-Access-Token"] or headers["x-access-token"]
                  if type(token) == "table" then
                    token = token[1]
                  end

                  local function has_any_required_role_from_jwt(jwt_token)
                    if type(jwt_token) ~= "string" or jwt_token == "" then
                      return false
                    end
                    local _, _, payload_b64 = string.find(jwt_token, "^[^.]+%.([^.]+)%.")
                    if not payload_b64 then
                      return false
                    end
                    payload_b64 = payload_b64:gsub("-", "+"):gsub("_", "/")
                    local mod = #payload_b64 % 4
                    if mod > 0 then
                      payload_b64 = payload_b64 .. string.rep("=", 4 - mod)
                    end
                    local payload_json = ngx.decode_base64(payload_b64)
                    if not payload_json then
                      return false
