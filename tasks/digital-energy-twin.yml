  uri:
    method: PUT
    url: "https://api-admin.{{ DOMAIN }}/apisix/admin/routes/digital-energy-twin-backend-admin-api"
    ca_path: "{{ inv_k8s.ingress.ca_path }}"
    body_format: json
    body:
      name: "digital-energy-twin-backend-admin-api"
      desc: "Backend admin API route (protected)"
      hosts:
        - "{{ digital_energy_twin_backend_direct_host }}"
      uri: "/api/admin/*"
      upstream_id: "digital-energy-twin-backend-upstream"
      status: 1
      plugins: "{{ digital_energy_twin_backend_common_plugins | combine({'openid-connect': {'bearer_only': false, 'client_id': digital_energy_twin_oidc_client_id, 'client_secret': digital_energy_twin_client_secret_response.json.value, 'redirect_uri': ('https://' ~ digital_energy_twin_backend_direct_host ~ digital_energy_twin_oidc_callback_path), 'discovery': (inv_access.platform.hostname ~ '/realms/' ~ inv_access.tenant.realm_name ~ '/.well-known/openid-configuration'), 'introspection_endpoint': (inv_access.platform.hostname ~ '/realms/' ~ inv_access.tenant.realm_name ~ '/protocol/openid-connect/token/introspect'), 'introspection_endpoint_auth_method': 'post', 'realm': inv_access.tenant.realm_name, 'set_access_token_header': true, 'set_userinfo_header': true, 'session': {'secret': (digital_energy_twin_oidc_session_secret | default(inv_access.apisix.api_credentials.admin_role)), 'cookie': {'name': 'det_api_session', 'domain': ('.' ~ DOMAIN), 'path': '/', 'secure': true, 'http_only': true, 'samesite': 'None'}}}}, recursive=True) }}"
    headers:
      Accept: application/json
      X-API-KEY: "{{ inv_access.apisix.api_credentials.admin_role }}"
    status_code:
      - 200
      - 201
  when: digital_energy_twin_enabled
