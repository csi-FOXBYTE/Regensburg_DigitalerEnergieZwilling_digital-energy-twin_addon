---
- name: "Digital Energy Twin: Load config"
  set_fact:
    digital_energy_twin: "{{ inv_addons['digital-energy-twin'] }}"

- name: "Digital Energy Twin: Validate required config"
  ansible.builtin.assert:
    that:
      - digital_energy_twin.enable is defined
      - digital_energy_twin.ns_create is defined
      - digital_energy_twin.ns_name is defined
      - digital_energy_twin.ns_kubeconfig is defined
      - digital_energy_twin.public_requires_login is defined
      - digital_energy_twin.oidc_client_id is defined
      - digital_energy_twin.admin_host is defined
      - digital_energy_twin.public_host is defined
      - digital_energy_twin.backend_host is defined
      - digital_energy_twin.backend_cors_additional_origins is defined
    fail_msg: >-
      Missing required keys in inv_addons['digital-energy-twin'].
      Expected: enable, ns_create, ns_name, ns_kubeconfig, public_requires_login, oidc_client_id,
      admin_host, public_host, backend_host, backend_cors_additional_origins.

- name: "Digital Energy Twin: Set defaults"
  set_fact:
    digital_energy_twin_enabled: "{{ digital_energy_twin.enable | bool }}"
    digital_energy_twin_ns_create: "{{ digital_energy_twin.ns_create | bool }}"
    digital_energy_twin_namespace: "{{ digital_energy_twin.ns_name }}"
    digital_energy_twin_oidc_callback_path: "/oidc/callback"
    digital_energy_twin_public_requires_login: "{{ digital_energy_twin.public_requires_login | bool }}"
    digital_energy_twin_oidc_client_id: "{{ digital_energy_twin.oidc_client_id }}"
    digital_energy_twin_admin_direct_host: "{{ digital_energy_twin.admin_host }}"
    digital_energy_twin_public_direct_host: "{{ digital_energy_twin.public_host }}"
    digital_energy_twin_backend_direct_host: "{{ digital_energy_twin.backend_host }}"
    digital_energy_twin_admin_image: "{{ digital_energy_twin.admin_image | default(software.digital_energy_twin_addon.admin.registry ~ '/' ~ software.digital_energy_twin_addon.admin.repository ~ ':' ~ software.digital_energy_twin_addon.admin.tag) }}"
    digital_energy_twin_public_image: "{{ digital_energy_twin.public_image | default(software.digital_energy_twin_addon.public.registry ~ '/' ~ software.digital_energy_twin_addon.public.repository ~ ':' ~ software.digital_energy_twin_addon.public.tag) }}"
    digital_energy_twin_backend_image: "{{ digital_energy_twin.backend_image | default(software.digital_energy_twin_addon.backend.registry ~ '/' ~ software.digital_energy_twin_addon.backend.repository ~ ':' ~ software.digital_energy_twin_addon.backend.tag) }}"
    digital_energy_twin_db_host: "central-db.{{ inv_central_db.ns_name }}.svc.cluster.local"
    digital_energy_twin_db_port: "{{ inv_central_db.port }}"
    digital_energy_twin_db_name: "postgres"
    digital_energy_twin_backend_port: "{{ digital_energy_twin.backend_port | default(5000) | int }}"
    digital_energy_twin_admin_port: "{{ digital_energy_twin.admin_port | default(8080) | int }}"
    digital_energy_twin_public_port: "{{ digital_energy_twin.public_port | default(8080) | int }}"
    digital_energy_twin_admin_required_role: "admin"
    digital_energy_twin_viewer_required_role: "viewer"
    digital_energy_twin_backend_common_plugins:
      cors:
        allow_origins: "{{ ((['https://' ~ digital_energy_twin.public_host, 'https://' ~ digital_energy_twin.admin_host] + digital_energy_twin.backend_cors_additional_origins) | unique) | join(',') }}"
        allow_methods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
        allow_headers: "Accept,Authorization,Content-Type,Origin,Referer,User-Agent,X-Access-Token,X-Requested-With"
        expose_headers: "Content-Length,Content-Type,Date,Server"
        max_age: 3600
        allow_credential: true
      limit-count:
        count: 200
        time_window: 60
        rejected_code: 429
        key_type: var
        key: remote_addr
        policy: local
      response-rewrite:
        headers:
          set:
            X-Content-Type-Options: "nosniff"
            X-Frame-Options: "DENY"
            Referrer-Policy: "strict-origin-when-cross-origin"
            Permissions-Policy: "geolocation=(), microphone=(), camera=()"
            X-XSS-Protection: "1; mode=block"
            Strict-Transport-Security: "max-age=31536000; includeSubDomains"
            Content-Security-Policy: "default-src 'self'; frame-ancestors 'none'; base-uri 'self'"

- name: "Digital Energy Twin: Set service names"
  set_fact:
    digital_energy_twin_admin_service_name: "{{ digital_energy_twin_admin_direct_host | replace('.', '-') }}"
    digital_energy_twin_public_service_name: "{{ digital_energy_twin_public_direct_host | replace('.', '-') }}"
    digital_energy_twin_backend_service_name: "{{ digital_energy_twin_backend_direct_host | replace('.', '-') }}"

- name: "Digital Energy Twin: Resolve upstreams"
  set_fact:
    digital_energy_twin_admin_upstream_host: "{{ digital_energy_twin_admin_service_name }}.{{ digital_energy_twin_namespace }}.svc.cluster.local"
    digital_energy_twin_admin_upstream_port: "{{ digital_energy_twin_admin_port }}"
    digital_energy_twin_public_upstream_host: "{{ digital_energy_twin_public_service_name }}.{{ digital_energy_twin_namespace }}.svc.cluster.local"
    digital_energy_twin_public_upstream_port: "{{ digital_energy_twin_public_port }}"
    digital_energy_twin_backend_upstream_host: "{{ digital_energy_twin_backend_service_name }}.{{ digital_energy_twin_namespace }}.svc.cluster.local"
  when: digital_energy_twin_enabled

- name: "Digital Energy Twin: Set default facts for K8S"
  ansible.builtin.set_fact:
    k8s_config: "{{ K8S_KUBECONFIG_PATH }}/{{ digital_energy_twin.ns_kubeconfig }}"
    k8s_context: "{{ inv_k8s.config.context }}"
    k8s_namespace: "{{ digital_energy_twin_namespace }}"
  when: digital_energy_twin_enabled

- name: "Digital Energy Twin: Ensure namespace exists (if ns_create=true)"
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ k8s_namespace }}"
  when: digital_energy_twin_enabled and digital_energy_twin_ns_create

- name: "Digital Energy Twin: Check namespace exists (if ns_create=false)"
  kubernetes.core.k8s_info:
    kind: Namespace
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    name: "{{ k8s_namespace }}"
  register: digital_energy_twin_namespace_info
  when: digital_energy_twin_enabled and not digital_energy_twin_ns_create

- name: "Digital Energy Twin: Fail if namespace is missing and ns_create=false"
  ansible.builtin.assert:
    that:
      - digital_energy_twin_namespace_info.resources | length > 0
    fail_msg: >-
      Namespace '{{ k8s_namespace }}' does not exist but ns_create is false.
      Create the namespace manually or set inv_addons['digital-energy-twin'].ns_create to true.
  when: digital_energy_twin_enabled and not digital_energy_twin_ns_create

- name: "Digital Energy Twin: Get central DB credentials secret"
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: "{{ inv_central_db.ns_name }}"
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    name: postgres.central-db.credentials.postgresql.acid.zalan.do
  register: digital_energy_twin_db_secret
  when: digital_energy_twin_enabled

- name: "Digital Energy Twin: Set DB credentials from internal DB"
  set_fact:
    digital_energy_twin_db_user: "{{ digital_energy_twin_db_secret.resources[0].data.username | b64decode }}"
    digital_energy_twin_db_password: "{{ digital_energy_twin_db_secret.resources[0].data.password | b64decode }}"
  when: digital_energy_twin_enabled
  failed_when: digital_energy_twin_db_secret.resources | length == 0

- name: "Digital Energy Twin: Build backend database URL"
  set_fact:
    digital_energy_twin_database_url: "postgresql://{{ digital_energy_twin_db_user }}:{{ digital_energy_twin_db_password }}@{{ digital_energy_twin_db_host }}:{{ digital_energy_twin_db_port }}/{{ digital_energy_twin_db_name }}"
  when: digital_energy_twin_enabled

- name: "Digital Energy Twin: Ensure placeholder content configmap"
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    namespace: "{{ k8s_namespace }}"
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: digital-energy-twin-placeholder
      data:
        admin-index.html: |
          <!doctype html>
          <html>
            <head><meta charset="utf-8"><title>Digital Energy Twin Admin</title></head>
            <body><h1>hello world</h1><p>admin client</p></body>
          </html>
        public-index.html: |
          <!doctype html>
          <html>
            <head><meta charset="utf-8"><title>Digital Energy Twin Public</title></head>
            <body><h1>hello world</h1><p>public client</p></body>
          </html>
  when: digital_energy_twin_enabled

- name: "Digital Energy Twin: Ensure admin deployment"
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    namespace: "{{ k8s_namespace }}"
    definition: "{{ lookup('template', addon_dir + 'templates/digital_energy_twin_admin_deploy.yaml.j2') | from_yaml }}"
  when: digital_energy_twin_enabled

- name: "Digital Energy Twin: Ensure admin service"
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    namespace: "{{ k8s_namespace }}"
    definition: "{{ lookup('template', addon_dir + 'templates/digital_energy_twin_admin_svc.yaml.j2') | from_yaml }}"
  when: digital_energy_twin_enabled

- name: "Digital Energy Twin: Ensure public deployment"
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    namespace: "{{ k8s_namespace }}"
    definition: "{{ lookup('template', addon_dir + 'templates/digital_energy_twin_public_deploy.yaml.j2') | from_yaml }}"
  when: digital_energy_twin_enabled

- name: "Digital Energy Twin: Ensure public service"
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    namespace: "{{ k8s_namespace }}"
    definition: "{{ lookup('template', addon_dir + 'templates/digital_energy_twin_public_svc.yaml.j2') | from_yaml }}"
  when: digital_energy_twin_enabled

- name: "Digital Energy Twin: Ensure backend deployment"
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    namespace: "{{ k8s_namespace }}"
    definition: "{{ lookup('template', addon_dir + 'templates/digital_energy_twin_backend_deploy.yaml.j2') | from_yaml }}"
  when: digital_energy_twin_enabled

- name: "Digital Energy Twin: Ensure backend service"
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    namespace: "{{ k8s_namespace }}"
    definition: "{{ lookup('template', addon_dir + 'templates/digital_energy_twin_backend_svc.yaml.j2') | from_yaml }}"
  when: digital_energy_twin_enabled

- name: "Digital Energy Twin: Ensure ingress for admin direct host"
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    namespace: "{{ k8s_namespace }}"
    definition:
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: digital-energy-twin-admin-host
        annotations:
          cert-manager.io/cluster-issuer: "{{ inv_k8s.cert_manager.issuer_name }}"
          kubernetes.io/tls-acme: "true"
          nginx.ingress.kubernetes.io/ssl-redirect: "{{ open_http_port|default('true')|lower }}"
      spec:
        ingressClassName: "{{ inv_k8s.ingress_class }}"
        tls:
          - hosts:
              - "{{ digital_energy_twin_admin_direct_host }}"
            secretName: "{{ digital_energy_twin_admin_direct_host }}-tls"
        rules:
          - host: "{{ digital_energy_twin_admin_direct_host }}"
            http:
              paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: "{{ digital_energy_twin_admin_service_name }}"
                      port:
                        name: http
  when: digital_energy_twin_enabled

- name: "Digital Energy Twin: Ensure ingress for public direct host"
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    namespace: "{{ k8s_namespace }}"
    definition:
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: digital-energy-twin-public-host
        annotations:
          cert-manager.io/cluster-issuer: "{{ inv_k8s.cert_manager.issuer_name }}"
          kubernetes.io/tls-acme: "true"
          nginx.ingress.kubernetes.io/ssl-redirect: "{{ open_http_port|default('true')|lower }}"
      spec:
        ingressClassName: "{{ inv_k8s.ingress_class }}"
        tls:
          - hosts:
              - "{{ digital_energy_twin_public_direct_host }}"
            secretName: "{{ digital_energy_twin_public_direct_host }}-tls"
        rules:
          - host: "{{ digital_energy_twin_public_direct_host }}"
            http:
              paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: "{{ digital_energy_twin_public_service_name }}"
                      port:
                        name: http
  when: digital_energy_twin_enabled

- name: "Digital Energy Twin: Ensure ingress for backend direct host"
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    namespace: "{{ k8s_namespace }}"
    definition:
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: digital-energy-twin-backend-host
        annotations:
          cert-manager.io/cluster-issuer: "{{ inv_k8s.cert_manager.issuer_name }}"
          kubernetes.io/tls-acme: "true"
          nginx.ingress.kubernetes.io/ssl-redirect: "{{ open_http_port|default('true')|lower }}"
      spec:
        ingressClassName: "{{ inv_k8s.ingress_class }}"
        tls:
          - hosts:
              - "{{ digital_energy_twin_backend_direct_host }}"
            secretName: "{{ digital_energy_twin_backend_direct_host }}-tls"
        rules:
          - host: "{{ digital_energy_twin_backend_direct_host }}"
            http:
              paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: "{{ digital_energy_twin_backend_service_name }}"
                      port:
                        name: http
  when: digital_energy_twin_enabled

- name: "Digital Energy Twin: Get IDM settings and api-access secret"
  include_tasks:
    file: "../../../tasks/access/apis/idm_settings_for_apis.yaml"
  when: digital_energy_twin_enabled

- name: "Digital Energy Twin: Check if OIDC client exists"
  set_fact:
    digital_energy_twin_client_exists: "{{ (clients.json | json_query(query) | length) > 0 }}"
  vars:
    query: "[?clientId== '{{ digital_energy_twin_oidc_client_id }}']"
  when: digital_energy_twin_enabled

- name: "Digital Energy Twin: Create OIDC client"
  uri:
    method: POST
    url: "{{ inv_access.platform.hostname }}/auth/admin/realms/{{ inv_access.tenant.realm_name }}/clients"
    return_content: yes
    ca_path: "{{ inv_k8s.ingress.ca_path }}"
    body_format: json
    body:
      clientId: "{{ digital_energy_twin_oidc_client_id }}"
      enabled: true
      clientAuthenticatorType: "client-secret"
      protocol: "openid-connect"
      publicClient: false
      standardFlowEnabled: true
      directAccessGrantsEnabled: true
      redirectUris:
        - "https://{{ digital_energy_twin_admin_direct_host }}/*"
        - "https://{{ digital_energy_twin_public_direct_host }}/*"
        - "https://{{ digital_energy_twin_admin_direct_host }}{{ digital_energy_twin_oidc_callback_path }}"
        - "https://{{ digital_energy_twin_public_direct_host }}{{ digital_energy_twin_oidc_callback_path }}"
      webOrigins:
        - "https://{{ digital_energy_twin_admin_direct_host }}"
        - "https://{{ digital_energy_twin_public_direct_host }}"
        - "https://{{ digital_energy_twin_backend_direct_host }}"
    headers:
      Accept: application/json
      Authorization: "Bearer {{ keycloak_login.json.access_token }}"
    status_code:
      - 201
      - 409
  when: digital_energy_twin_enabled and not digital_energy_twin_client_exists

- name: "Digital Energy Twin: Refresh client list"
  uri:
    method: GET
    url: "{{ inv_access.platform.hostname }}/auth/admin/realms/{{ inv_access.tenant.realm_name }}/clients"
    return_content: yes
    ca_path: "{{ inv_k8s.ingress.ca_path }}"
    headers:
      Accept: application/json
      Authorization: "Bearer {{ keycloak_login.json.access_token }}"
    status_code: 200
  register: digital_energy_twin_clients
  when: digital_energy_twin_enabled

- name: "Digital Energy Twin: Resolve OIDC client internal id"
  set_fact:
    digital_energy_twin_client_internal_id: "{{ digital_energy_twin_clients.json | json_query(query) }}"
  vars:
    query: "[?clientId== '{{ digital_energy_twin_oidc_client_id }}'].id | [0]"
  when: digital_energy_twin_enabled

- name: "Digital Energy Twin: Get existing OIDC client details"
  uri:
    method: GET
    url: "{{ inv_access.platform.hostname }}/auth/admin/realms/{{ inv_access.tenant.realm_name }}/clients/{{ digital_energy_twin_client_internal_id }}"
    return_content: yes
    ca_path: "{{ inv_k8s.ingress.ca_path }}"
    headers:
      Accept: application/json
      Authorization: "Bearer {{ keycloak_login.json.access_token }}"
    status_code: 200
  register: digital_energy_twin_client_details
  when: digital_energy_twin_enabled

- name: "Digital Energy Twin: Update OIDC client redirect/web origins"
  uri:
    method: PUT
    url: "{{ inv_access.platform.hostname }}/auth/admin/realms/{{ inv_access.tenant.realm_name }}/clients/{{ digital_energy_twin_client_internal_id }}"
    return_content: yes
    ca_path: "{{ inv_k8s.ingress.ca_path }}"
    body_format: json
    body: "{{ digital_energy_twin_client_details.json | combine(client_updates, recursive=True) }}"
    headers:
      Accept: application/json
      Authorization: "Bearer {{ keycloak_login.json.access_token }}"
    status_code: 204
  vars:
    client_updates:
      redirectUris:
        - "https://{{ digital_energy_twin_admin_direct_host }}/*"
        - "https://{{ digital_energy_twin_public_direct_host }}/*"
        - "https://{{ digital_energy_twin_admin_direct_host }}{{ digital_energy_twin_oidc_callback_path }}"
        - "https://{{ digital_energy_twin_public_direct_host }}{{ digital_energy_twin_oidc_callback_path }}"
      webOrigins:
        - "https://{{ digital_energy_twin_admin_direct_host }}"
        - "https://{{ digital_energy_twin_public_direct_host }}"
        - "https://{{ digital_energy_twin_backend_direct_host }}"
  when: digital_energy_twin_enabled

- name: "Digital Energy Twin: Get OIDC client secret"
  uri:
    method: GET
    url: "{{ inv_access.platform.hostname }}/auth/admin/realms/{{ inv_access.tenant.realm_name }}/clients/{{ digital_energy_twin_client_internal_id }}/client-secret"
    return_content: yes
    ca_path: "{{ inv_k8s.ingress.ca_path }}"
    headers:
      Accept: application/json
      Authorization: "Bearer {{ keycloak_login.json.access_token }}"
    status_code: 200
  register: digital_energy_twin_client_secret_response
  when: digital_energy_twin_enabled

- name: "Digital Energy Twin: Ensure OIDC client role admin"
  uri:
    method: POST
    url: "{{ inv_access.platform.hostname }}/auth/admin/realms/{{ inv_access.tenant.realm_name }}/clients/{{ digital_energy_twin_client_internal_id }}/roles"
    return_content: yes
    ca_path: "{{ inv_k8s.ingress.ca_path }}"
    body_format: json
    body:
      name: "{{ digital_energy_twin_admin_required_role }}"
      composite: false
      clientRole: true
    headers:
      Accept: application/json
      Authorization: "Bearer {{ keycloak_login.json.access_token }}"
    status_code:
      - 201
      - 409
  when: digital_energy_twin_enabled

- name: "Digital Energy Twin: Ensure OIDC client role viewer"
  uri:
    method: POST
    url: "{{ inv_access.platform.hostname }}/auth/admin/realms/{{ inv_access.tenant.realm_name }}/clients/{{ digital_energy_twin_client_internal_id }}/roles"
    return_content: yes
    ca_path: "{{ inv_k8s.ingress.ca_path }}"
    body_format: json
    body:
      name: "{{ digital_energy_twin_viewer_required_role }}"
      composite: false
      clientRole: true
    headers:
      Accept: application/json
      Authorization: "Bearer {{ keycloak_login.json.access_token }}"
    status_code:
      - 201
      - 409
  when: digital_energy_twin_enabled

- name: "Digital Energy Twin: Upsert APISIX upstream (admin)"
  uri:
    method: PUT
    url: "https://api-admin.{{ DOMAIN }}/apisix/admin/upstreams/digital-energy-twin-admin-upstream"
    ca_path: "{{ inv_k8s.ingress.ca_path }}"
    body_format: json
    body:
      name: "digital-energy-twin-admin-upstream"
      desc: "Admin upstream for static panel"
      type: "roundrobin"
      scheme: "http"
      nodes: "{{ { (digital_energy_twin_admin_upstream_host ~ ':' ~ digital_energy_twin_admin_upstream_port) : 1 } }}"
    headers:
      Accept: application/json
      X-API-KEY: "{{ inv_access.apisix.api_credentials.admin_role }}"
    status_code:
      - 200
      - 201
  when: digital_energy_twin_enabled

- name: "Digital Energy Twin: Upsert APISIX upstream (public)"
  uri:
    method: PUT
    url: "https://api-admin.{{ DOMAIN }}/apisix/admin/upstreams/digital-energy-twin-public-upstream"
    ca_path: "{{ inv_k8s.ingress.ca_path }}"
    body_format: json
    body:
      name: "digital-energy-twin-public-upstream"
      desc: "Public upstream for static panel"
      type: "roundrobin"
      scheme: "http"
      nodes: "{{ { (digital_energy_twin_public_upstream_host ~ ':' ~ digital_energy_twin_public_upstream_port) : 1 } }}"
    headers:
      Accept: application/json
      X-API-KEY: "{{ inv_access.apisix.api_credentials.admin_role }}"
    status_code:
      - 200
      - 201
  when: digital_energy_twin_enabled

- name: "Digital Energy Twin: Upsert APISIX upstream (backend)"
  uri:
    method: PUT
    url: "https://api-admin.{{ DOMAIN }}/apisix/admin/upstreams/digital-energy-twin-backend-upstream"
    ca_path: "{{ inv_k8s.ingress.ca_path }}"
    body_format: json
    body:
      name: "digital-energy-twin-backend-upstream"
      desc: "Backend upstream for API"
      type: "roundrobin"
      scheme: "http"
      nodes: "{{ { (digital_energy_twin_backend_upstream_host ~ ':' ~ digital_energy_twin_backend_port) : 1 } }}"
    headers:
      Accept: application/json
      X-API-KEY: "{{ inv_access.apisix.api_credentials.admin_role }}"
    status_code:
      - 200
      - 201
  when: digital_energy_twin_enabled

- name: "Digital Energy Twin: Upsert protected admin direct-host route"
  uri:
    method: PUT
    url: "https://api-admin.{{ DOMAIN }}/apisix/admin/routes/digital-energy-twin-admin-direct"
