name: CI

# Runs the offline unit tests and lints the workflows on every pull request
# and on main. Reads the repository only; deploys and pushes nothing.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout addon
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # tests/test_matomo_image.py runs images/matomo/sbom.mjs; the image
      # builds it on Node 24 (NODE_BASE in matomo-image.yml).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Install test dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check jinja2==3.1.6 pyyaml==6.0.2

      - name: Run unit tests
        shell: bash
        run: python -m unittest discover -s tests -v

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout addon
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The image bundles shellcheck, which also checks the run: scripts.
      - name: Lint workflows
        shell: bash
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -no-color
