name: Prepare application release

on:
  workflow_dispatch:
    inputs:
      application_release_tag:
        description: "Completed monorepo release tag to adopt (for example v1.7.3)"
        required: true
        type: string
      allow_prerelease:
        description: "Allow a completed application prerelease"
        required: true
        default: false
        type: boolean
      release_tag:
        description: "Addon release tag (leave empty to use the next minor version)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout addon
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate requested application tag
        env:
          APPLICATION_TAG: ${{ inputs.application_release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$APPLICATION_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Select an exact application release tag such as v1.7.3" >&2
            exit 1
          fi

      - name: Checkout the selected monorepo tag
        uses: actions/checkout@v4
        with:
          repository: csi-FOXBYTE/Regensburg_DigitalerEnergieZwilling_MonoRepo
          ref: ${{ inputs.application_release_tag }}
          path: .local/application-source
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .local/application-source/.node-version

      - name: Resolve addon release tag
        id: release
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail

          latest_version=$(git tag --list \
            | sed -nE 's/^v?([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' \
            | sort -V \
            | tail -n 1)

          if [[ -z "$latest_version" ]]; then
            suggested_tag="v0.1.0"
          else
            IFS=. read -r major minor _patch <<< "$latest_version"
            suggested_tag="v${major}.$((minor + 1)).0"
          fi

          release_tag="${REQUESTED_TAG:-$suggested_tag}"
          if [[ ! "$release_tag" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release_tag must be a semantic version such as v1.8.0" >&2
            exit 1
          fi
          {
            echo "tag=$release_tag"
            echo "suggested_tag=$suggested_tag"
          } >> "$GITHUB_OUTPUT"

      - name: Fetch and validate the completed application release
        id: application
        env:
          GH_TOKEN: ${{ github.token }}
          APPLICATION_TAG: ${{ inputs.application_release_tag }}
          ALLOW_PRERELEASE: ${{ inputs.allow_prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .local/application-release
          gh api "repos/csi-FOXBYTE/Regensburg_DigitalerEnergieZwilling_MonoRepo/releases/tags/$APPLICATION_TAG" \
            > .local/application-release/release.json
          cp .local/application-source/release/manifest.json .local/application-release/manifest.json

          source_commit=$(python3 -c 'import json; print(json.load(open(".local/application-release/manifest.json"))["sourceCommit"])')
          git -C .local/application-source merge-base --is-ancestor "$source_commit" HEAD

          options=()
          if [[ "$ALLOW_PRERELEASE" == true ]]; then
            options+=(--allow-prerelease)
          fi
          node .local/application-source/scripts/deploy/select-release.mjs \
            .local/application-release/release.json .local/application-release/manifest.json \
            "${options[@]}" > .local/application-release/selection.json

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          selected = json.loads(Path('.local/application-release/selection.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"tag=v{selected['appVersion']}\n")
              output.write(f"version={selected['appVersion']}\n")
              for component in ('adminfrontend', 'frontend', 'backend'):
                  output.write(f"{component}_image={selected['images'][component]}\n")
          PY

      - name: Record the manifest selection and bundled application SBOMs
        env:
          ADDON_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/adopt_application_release.py \
            .local/application-source \
            .local/application-release/release.json \
            .local/application-release/selection.json \
            "$ADDON_TAG" .

      - name: Generate and validate addon SBOM
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .sbom-env
          .sbom-env/bin/python -m pip install --requirement requirements-sbom.txt
          SBOM_REQUIRE_CHILD_BOMS=1 .sbom-env/bin/python scripts/generate_sbom.py

      - name: Create review pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: prepare-release/${{ steps.release.outputs.tag }}
          title: "chore: prepare addon release ${{ steps.release.outputs.tag }}"
          body: |
            Adopts the completed monorepo application release `${{ steps.application.outputs.tag }}`
            for addon release `${{ steps.release.outputs.tag }}`. The selected manifest,
            digest-pinned images, and matching child SBOMs are included for review.

            | Component | Image |
            |-----------|-------|
            | admin | `${{ steps.application.outputs.adminfrontend_image }}` |
            | public | `${{ steps.application.outputs.frontend_image }}` |
            | backend | `${{ steps.application.outputs.backend_image }}` |

            The pull request remains open for manual review. Merging it does not
            create an addon Git tag or release. Check the selected monorepo release
            and tag again before merging.

            Suggested next minor addon tag: `${{ steps.release.outputs.suggested_tag }}`.
          commit-message: "chore: prepare addon release ${{ steps.release.outputs.tag }}"
          draft: true
          delete-branch: true
