name: Release addon from application release

on:
  workflow_dispatch:
    inputs:
      application_release_tag:
        description: "Completed monorepo release tag to adopt (for example v1.7.3)"
        required: true
        type: string
      allow_prerelease:
        description: "Allow a completed application prerelease"
        required: true
        default: false
        type: boolean
permissions:
  contents: write

concurrency:
  group: addon-release-main
  cancel-in-progress: false

jobs:
  release-addon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout addon
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate requested application tag
        env:
          APPLICATION_TAG: ${{ inputs.application_release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$APPLICATION_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Select an exact application release tag such as v1.7.3" >&2
            exit 1
          fi

      - name: Checkout the selected monorepo tag
        uses: actions/checkout@v4
        with:
          repository: csi-FOXBYTE/Regensburg_DigitalerEnergieZwilling_MonoRepo
          ref: ${{ inputs.application_release_tag }}
          path: .local/application-source
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .local/application-source/.node-version

      - name: Fetch and validate the completed application release
        id: application
        env:
          GH_TOKEN: ${{ github.token }}
          APPLICATION_TAG: ${{ inputs.application_release_tag }}
          ALLOW_PRERELEASE: ${{ inputs.allow_prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .local/application-release
          gh api "repos/csi-FOXBYTE/Regensburg_DigitalerEnergieZwilling_MonoRepo/releases/tags/$APPLICATION_TAG" \
            > .local/application-release/release.json
          cp .local/application-source/release/manifest.json .local/application-release/manifest.json

          source_commit=$(python3 -c 'import json; print(json.load(open(".local/application-release/manifest.json"))["sourceCommit"])')
          git -C .local/application-source merge-base --is-ancestor "$source_commit" HEAD

          options=()
          if [[ "$ALLOW_PRERELEASE" == true ]]; then
            options+=(--allow-prerelease)
          fi
          node .local/application-source/scripts/deploy/select-release.mjs \
            .local/application-release/release.json .local/application-release/manifest.json \
            "${options[@]}" > .local/application-release/selection.json

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          selected = json.loads(Path('.local/application-release/selection.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"tag=v{selected['appVersion']}\n")
          PY

      - name: Record the manifest selection and bundled application SBOMs
        env:
          ADDON_TAG: ${{ steps.application.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/adopt_application_release.py \
            .local/application-source \
            .local/application-release/release.json \
            .local/application-release/selection.json \
            "$ADDON_TAG" .

      - name: Generate and validate addon SBOM
        env:
          ADDON_TAG: ${{ steps.application.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f vars/application_release.json && -f SBOM.cdx.json && -f SBOM.csv ]] \
            && [[ -z "$(git status --porcelain -- sbom.config.json vars/application_release.json vars/software_references.yml sboms)" ]] \
            && [[ "$(git log -1 --format=%s)" == "chore: release addon $ADDON_TAG" ]]; then
            echo "Selected release and its generated SBOM are already committed"
            exit 0
          fi
          python3 -m venv .sbom-env
          .sbom-env/bin/python -m pip install --requirement requirements-sbom.txt
          SBOM_REQUIRE_CHILD_BOMS=1 .sbom-env/bin/python scripts/generate_sbom.py

      - name: Commit release on main and push matching tag
        env:
          ADDON_TAG: ${{ steps.application.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- sbom.config.json vars/application_release.json \
            vars/software_references.yml sboms SBOM.cdx.json SBOM.csv

          if git show-ref --verify --quiet "refs/tags/$ADDON_TAG"; then
            if [[ "$(git rev-list -n 1 "$ADDON_TAG")" != "$(git rev-parse HEAD)" ]] \
              || ! git diff --cached --quiet; then
              echo "Addon tag $ADDON_TAG already exists for different release content" >&2
              exit 1
            fi
          elif ! git diff --cached --quiet; then
            git commit -m "chore: release addon $ADDON_TAG"
            git push origin HEAD:main
          fi

          if ! git show-ref --verify --quiet "refs/tags/$ADDON_TAG"; then
            git tag -a "$ADDON_TAG" -m "Release addon $ADDON_TAG"
            git push origin "refs/tags/$ADDON_TAG"
          fi

      - name: Publish matching GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          ADDON_TAG: ${{ steps.application.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$ADDON_TAG" >/dev/null 2>&1; then
            echo "GitHub release $ADDON_TAG already exists"
            exit 0
          fi

          options=()
          if [[ "$(python3 -c 'import json; print(str(json.load(open(".local/application-release/release.json")).get("prerelease", False)).lower())')" == true ]]; then
            options+=(--prerelease)
          fi
          gh release create "$ADDON_TAG" --verify-tag --title "$ADDON_TAG" \
            --notes "Adopts completed monorepo application release $ADDON_TAG with digest-pinned images and matching SBOMs." \
            "${options[@]}"
