---
imagePullSecret:
  registry: "{{ inv_op_stack.private_registry.registry_full_url | default(software.addon_digital-energy-twin.digital-energy-twin.registry) }}"
  username: "{{ inv_k8s.gitlab_access.user }}"
  password: "{{ inv_k8s.gitlab_access.token }}"
  email: "{{ inv_k8s.gitlab_access.user_email }}"

digital-energy-twin:
  image:
    name: "{{ inv_op_stack.private_registry.registry_full_url | default(software.addon_digital-energy-twin.digital-energy-twin.registry) }}/{{ software.addon_digital-energy-twin.digital-energy-twin.repository }}"
    tag: "{{ software.addon_digital-energy-twin.digital-energy-twin.tag }}"
