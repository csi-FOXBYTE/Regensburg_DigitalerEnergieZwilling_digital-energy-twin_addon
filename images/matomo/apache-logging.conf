# Access log without query string, referrer and user agent. The query string
# carries the OIDC code and state of the Keycloak callback and the one-time
# install link; referrer and user agent are not needed for operations.
# %h is the address of the proxy in front of Matomo, not the visitor's.
LogFormat "%h %l %u %t \"%m %U %H\" %>s %O %D" dez

# Apache's default error log format, without the referrer it appends to
# request errors (e.g. Keycloak's login URL with its session code).
ErrorLogFormat "[%{u}t] [%-m:%l] [pid %P:tid %{g}T] %7F: %E: [client\ %a] %M"
